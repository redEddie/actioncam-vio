schema_version: 2

camera:
  device: 2
  backend: V4L2
  width: 1920
  height: 1080
  transport_width: 256
  transport_height: 256
  warmup_frames: 5
  stale_timeout_s: 0.5

model:
  type: SmolVLA
  local_bundle: ../../artifacts/run/pretrained_model
  # Action contract:
  #   incremental_v1 (default) — 6D yaw-free step-to-step deltas, cumulative reconstruction
  #   se3_relwp_v1             — 10D SE(3) relative waypoints (V6 recipe); requires a bundle
  #                              trained on the se3_relwp dataset, e.g.:
  #                              local_bundle: ../../artifacts/run_candidates/v6_se3relwp_11k/pretrained_model
  action_contract: incremental_v1
  action_dimension: 6
  action_rate_hz: 10.0
  action_period_s: 0.1
  chunk_size: 15
  horizon_s: 1.5
  task: pick and place the target object
  robot_type: so_follower

remote:
  host: 155.230.189.77
  port: 17970
  user: kimminje
  python: /home/kimminje/miniconda3/envs/gopro_env/bin/python
  checkpoint: /home/kimminje/gopro_umi/artifacts/datasets/202608161903/04_training/final/pretrained_model
  batch_mode: true
  connect_timeout_s: 10.0
  ready_timeout_s: 120.0
  request_timeout_s: 3.0
  shutdown_timeout_s: 5.0
  request_queue_size: 1
  response_queue_size: 4

# UMI-style observation latency matching (timestamp alignment).
# When enabled, each request back-dates the camera frame by the measured glass-to-host
# latency and interpolates the robot state at that capture instant, so the (image, state)
# tuple is simultaneous — identical in form to the training dataset. Re-measure the
# constant with gopro_vio/latency_test.py when the camera/capture path changes (HERO13!).
# NOTE: use with a model trained on synced data (V6). Do NOT combine with a model that
# bakes staleness into training (V7-style) — that would double-compensate.
observation_alignment:
  enable: false
  camera_glass_to_host_latency_s: 0.088   # HERO7 + GC553Pro, latency_test v3 (2026-07-13)

motor:
  port: /dev/ttyACM0
  calibration: so_follower_calibration.json
  pid:
    p: 64
    i: 0
    d: 32
  start_move_duration_s: 6.0
  start_move_steps: 30
  settle_duration_s: 0.5
  hold_presettle_s: 2.0
  disable_torque_on_disconnect: false

controller:
  control_rate_hz: 30.0
  k_ext: 0.5
  q_corr_clamp_deg: 2.0
  support_bias:
    # Signed direct position compensation, independent of K_ext.
    static_deg: [0.264, 0.0, 0.0, 0.0, -0.352]

gravity_compensation:
  enabled: true
  urdf: ../control/gravity_assets/so_arm101_stock_inertial_gravity_v1.urdf
  urdf_sha256: 2f3269d80f84ab0040a8160b34e99bf16c8f3f197eb989e1a6afee6567725c61
  reference_pose_source: physical_start.urdf_start_deg
  # Signed direct position compensation at the reference pose. The pitch
  # commands oppose the generalized torque exerted by gravity.
  reference_bias_deg: [0.0, -0.615, -2.286, -0.703, 0.0]
  ratio_clip: 1.5
  denominator_guard_nm: 0.0001
  gravity_m_s2: 9.81
  gripper_link: gripper_link
  tool_reference_link: gripper_frame_link
  stock_moving_jaw_link: moving_jaw_so101_v1_link
  camera:
    mass_kg: 0.240
    backward_m: 0.030
    upward_m: 0.055
  custom_jaw:
    assembly_mass_kg: 0.280
    length_scale: 2.0
    com_fraction_from_base: 0.3333333333333333

scheduler:
  request_stride_s: 0.9
  transition_overlap_s: 0.2
  stale_trajectory_timeout_s: 0.1

safety:
  safe_limit_margin_deg: 0.0
  hold_last_timeout_s: 0.5

telemetry:
  output_dir: ../../runtime_logs
