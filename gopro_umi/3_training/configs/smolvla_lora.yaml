# Project reference values for train_smolvla.py.
# This file is not a lerobot-train --config_path file; the wrapper passes CLI
# options directly. Keep it synchronized with the effective dataset schema.

model:
  name: "SmolVLA"
  base_model: "lerobot/smolvla_base"
  training_mode: "pretrained_policy_finetune"
  push_to_hub: false

dataset:
  zarr_source: "2_dataset/replay_buffer.zarr"
  lerobot_root: "2_dataset/lerobot_dataset"
  repo_id: "gopro_umi/smolvla_dataset"
  num_episodes: 56
  fps: 60
  observation_image: "observation.images.top"
  observation_state:
    shape: [7]
    axes: [x, y, z, rx, ry, rz, gripper]
  action:
    shape: [7]
    axes: [x, y, z, rx, ry, rz, gripper]
    target: "next_frame_absolute_state"

training:
  wrapper: "3_training/train_smolvla.py"
  batch_size: 32
  steps: 20000
  output_dir: "3_training/smolvla_run"

checkpoint:
  output_dir: "3_training/smolvla_run/checkpoints"
