%YAML:1.0
File.version: "1.0"
Camera.type: "KannalaBrandt8"
# fisheye KB4 intrinsics calibrated from ChArUco (gopro_vio.charuco),
# scaled from 3840x3360 to 960x840
Camera1.fx: 433.101901
Camera1.fy: 434.207748
Camera1.cx: 477.642906
Camera1.cy: 418.601344
Camera1.k1: 0.0373407865
Camera1.k2: 0.0490165087
Camera1.k3: -0.0338129264
Camera1.k4: 0.0062461906
Camera.width: 960
Camera.height: 840
Camera.fps: 30
Camera.RGB: 1
# camera->IMU(body) transform calibrated from gyro/vision alignment
# (gopro_vio.imu_sync); translation not observable, set to zero
IMU.T_b_c1: !!opencv-matrix
    rows: 4
    cols: 4
    dt: f
    data: [0.01471077, -0.99988803, 0.00274370, 0.00000000, -0.99985068, -0.01473499, -0.00902765, 0.00000000, 0.00906707, -0.00261048, -0.99995549, 0.00000000, 0.00000000, 0.00000000, 0.00000000, 1.00000000]
# GoPro-class IMU noise (values from UMI's GoPro settings, inflated)
IMU.NoiseGyro: 0.0015
IMU.NoiseAcc: 0.017
IMU.GyroWalk: 5.0e-5
IMU.AccWalk: 0.0055
IMU.Frequency: 200.0
System.thFarPoints: 100.0
ORBextractor.nFeatures: 2500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 0.5
